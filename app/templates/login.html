<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card { width: 100%; max-width: 480px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="card bg-black text-light border-secondary shadow">
            <div class="card-body p-4">
                <h2 class="text-center mb-2">🏇</h2>
                <h4 class="text-center mb-4">Sistema de Gestión<br>de Jineteadas</h4>

                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="post" action="/login">
                    <input type="hidden" name="next" value="{{ next or '/' }}">

                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" name="usuario" class="form-control" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                </form>

                <p class="text-center text-secondary mt-4 mb-0">Versión 0.1.0-dev</p>
            </div>
        </div>
    </div>
</body>
</html>
