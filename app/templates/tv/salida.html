<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Salida TV</title>
<style>
html,body{width:1920px;height:1080px;margin:0;overflow:hidden;background:transparent!important;font-family:Inter,Segoe UI,Arial,Helvetica,sans-serif;color:#fff}*{box-sizing:border-box}
#stage{position:relative;width:1920px;height:1080px;background:transparent;opacity:1;transition:opacity .15s ease}.hidden{opacity:0!important;pointer-events:none}
.lower{position:absolute;filter:drop-shadow(0 12px 24px rgba(0,0,0,.35))}.lower-shell{position:relative;overflow:hidden;border-radius:16px;background:var(--graph-bg);color:var(--graph-text);border:1px solid rgba(255,255,255,.14)}.lower-accent{position:absolute;left:0;top:0;bottom:0;width:12px;background:var(--graph-main)}.lower-top{display:flex;align-items:center;gap:14px;padding:13px 28px 8px 36px;border-bottom:1px solid rgba(255,255,255,.12)}.brand-pill{background:var(--graph-main);color:#fff;font-size:17px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;padding:7px 13px;border-radius:999px}.cat-pill{margin-left:auto;border:1px solid color-mix(in srgb,var(--graph-main) 65%,white 35%);color:var(--graph-main);font-size:18px;font-weight:900;text-transform:uppercase;padding:6px 13px;border-radius:999px}.lower-body{padding:17px 34px 20px 36px}.line1{font-size:var(--graph-name);line-height:1.02;font-weight:900;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}.line2{font-size:var(--graph-detail);margin-top:8px;text-transform:uppercase;color:var(--graph-secondary);font-weight:700}.green-rule{height:5px;width:42%;background:var(--graph-main);border-radius:999px;margin-top:14px}
.table-card{position:absolute;inset:80px 105px;background:var(--table-bg);color:var(--table-text);border:1px solid rgba(255,255,255,.15);border-top:8px solid var(--table-accent);border-radius:20px;padding:30px 40px;box-shadow:0 18px 50px rgba(0,0,0,.35)}.table-head{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid color-mix(in srgb,var(--table-accent) 55%,transparent);padding-bottom:16px;margin-bottom:10px}.table-kicker{font-size:18px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--table-accent)}.table-title{font-size:42px;font-weight:900;text-transform:uppercase}.table-sub{font-size:23px;opacity:.78;text-transform:uppercase}.rows{display:grid}.row{display:grid;grid-template-columns:105px 1.7fr 1.5fr 170px;align-items:center;min-height:82px;border-bottom:1px solid rgba(255,255,255,.12);font-size:var(--table-font)}.row.header{min-height:50px;font-size:18px;color:var(--table-accent);text-transform:uppercase;font-weight:900}.row .order{font-weight:900;color:var(--table-accent)}.row .name{font-weight:850;text-transform:uppercase}.row .horse{text-transform:uppercase;opacity:.88}.row .pal{text-align:center;font-weight:900}
.ticker-wrap{position:absolute;left:0;right:0;bottom:var(--ticker-bottom);height:var(--ticker-height);background:var(--ticker-bg);color:var(--ticker-text);display:flex;align-items:center;overflow:hidden;border-top:5px solid var(--ticker-accent);box-shadow:0 12px 30px rgba(0,0,0,.3)}.ticker-label{height:100%;display:flex;align-items:center;flex:0 0 auto;background:var(--ticker-accent);color:#fff;font-size:24px;font-weight:900;text-transform:uppercase;padding:0 34px;z-index:2;letter-spacing:.04em}.ticker-viewport{overflow:hidden;white-space:nowrap;flex:1}.ticker-track{display:inline-block;padding-left:100%;font-size:var(--ticker-font);font-weight:800;text-transform:uppercase;animation:ticker var(--ticker-speed) linear infinite}.ticker-item{display:inline-block}.ticker-cat{color:var(--ticker-accent);font-weight:950}.sep{display:inline-block;color:var(--ticker-accent);padding:0 28px}@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.positions-note{font-size:30px;opacity:.8;margin-top:20px}.adjusted{color:var(--graph-main);font-weight:900}
</style>
</head>
<body>
<div id="stage" class="hidden"></div>
<script>
const TOKEN={{ token|tojson }};const TYPE={{ tipo|tojson }};const PREVIEW={{ preview|tojson }};
let lastStamp=null;let tableTimer=null;let tablePage=1;let lastPayload=null;
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function applyConfig(d){const c=d.config||{};const root=document.documentElement.style;root.setProperty('--graph-main',c.graph_color_principal||'#00A651');root.setProperty('--graph-bg',c.graph_color_fondo||'#101820');root.setProperty('--graph-text',c.graph_color_texto||'#FFFFFF');root.setProperty('--graph-secondary',c.graph_color_secundario||'#D9E2E8');root.setProperty('--graph-name',(c.graph_nombre_px||54)+'px');root.setProperty('--graph-detail',(c.graph_detalle_px||31)+'px');root.setProperty('--ticker-bg',c.ticker_color_fondo||'#101820');root.setProperty('--ticker-text',c.ticker_color_texto||'#FFFFFF');root.setProperty('--ticker-accent',c.ticker_color_acento||'#00A651');root.setProperty('--ticker-font',(c.ticker_fuente_px||30)+'px');root.setProperty('--ticker-height',(c.ticker_alto_px||96)+'px');root.setProperty('--ticker-bottom',(c.ticker_bottom_px||48)+'px');root.setProperty('--ticker-speed',(c.ticker_velocidad_seg||28)+'s');root.setProperty('--table-bg',c.tabla_color_fondo||'#101820');root.setProperty('--table-text',c.tabla_color_texto||'#FFFFFF');root.setProperty('--table-accent',c.tabla_color_acento||'#00A651');root.setProperty('--table-font',(c.tabla_fuente_px||30)+'px');}
function lower(d){if(!d.actual)return '';const c=d.config||{},f=d.graph_campos||{};const a=d.actual;const line1=[];if(f.jinete)line1.push(esc(a.jinete));if(f.localidad)line1.push(esc(a.localidad));const line2=[];if(f.caballo)line2.push(esc(a.caballo));if(f.palenque)line2.push('PALENQUE '+esc(a.palenque));const cat=f.categoria?`<span class="cat-pill">${esc(d.categoria||'')}</span>`:'';return `<div class="lower" style="left:${c.graph_left_px||64}px;bottom:${c.graph_bottom_px||72}px;width:${c.graph_ancho_px||1280}px"><div class="lower-shell"><div class="lower-accent"></div><div class="lower-top"><span class="brand-pill">Río Negro · Jineteada</span>${cat}</div><div class="lower-body">${line1.length?`<div class="line1">${line1.join(' <span style="opacity:.6">·</span> ')}</div>`:''}${line2.length?`<div class="line2">${line2.join(' &nbsp;·&nbsp; ')}</div>`:''}<div class="green-rule"></div></div></div></div>`;}
function renderTable(d,page){const per=d.filas_por_pagina||8,total=Math.max(1,Math.ceil(d.detalles.length/per));page=Math.min(Math.max(1,page),total);tablePage=page;const rows=d.detalles.slice((page-1)*per,page*per).map(x=>`<div class="row"><div class="order">#${String(x.orden).padStart(2,'0')}</div><div class="name">${esc(x.jinete)}</div><div class="horse">${esc(x.caballo)}</div><div class="pal">P${esc(x.palenque)}</div></div>`).join('');return `<div class="table-card"><div class="table-head"><div><div class="table-kicker">Orden de monta</div><div class="table-title">${esc(d.categoria||'')}</div></div><div class="table-sub">${esc(d.fecha||'')} · ${page}/${total}</div></div><div class="rows"><div class="row header"><div>Orden</div><div>Jinete</div><div>Caballo</div><div>Palenque</div></div>${rows}</div></div>`;}
function ticker(d){const list=d.siguientes||[];const label=`<div class="ticker-label">Próximas montas</div>`;if(!list.length)return `<div class="ticker-wrap">${label}<div class="ticker-viewport"><div class="ticker-track">SIN PRÓXIMAS MONTAS</div></div></div>`;const items=list.map(x=>`<span class="ticker-item"><span class="ticker-cat">${esc(x.categoria||d.categoria||'')}</span> · #${String(x.orden).padStart(2,'0')} ${esc(x.jinete)} · ${esc(x.caballo)} · P${esc(x.palenque)}</span>`).join('<span class="sep">◆</span>');return `<div class="ticker-wrap">${label}<div class="ticker-viewport"><div class="ticker-track">${items}</div></div></div>`;}
function positions(d){if(!d.posiciones_disponibles||!(d.posiciones||[]).length)return `<div class="table-card"><div class="table-kicker">${esc(d.categoria||'')}</div><div class="table-title">Posiciones del campeonato</div><div class="positions-note">Todavía no hay resultados finalizados para esta categoría.</div></div>`;const rows=(d.posiciones||[]).slice(0,d.filas_por_pagina||8).map(x=>`<div class="row" style="grid-template-columns:130px 1fr 220px"><div class="order">#${esc(x.posicion)}</div><div class="name">${esc(x.jinete)}<div style="font-size:.65em;opacity:.7;font-weight:600">${esc(x.localidad||'')}</div></div><div class="pal">${Number(x.puntos||0).toFixed(2)} PTS</div></div>`).join('');return `<div class="table-card"><div class="table-head"><div><div class="table-kicker">${esc(d.categoria||'')}</div><div class="table-title">Posiciones del campeonato</div></div><div class="table-sub">${esc(d.campeonato||'')}</div></div><div class="rows"><div class="row header" style="grid-template-columns:130px 1fr 220px"><div>Pos.</div><div>Jinete</div><div style="text-align:center">Puntos</div></div>${rows}</div></div>`;}
function stopTableTimer(){if(tableTimer){clearInterval(tableTimer);tableTimer=null;}}
function scheduleTable(d){stopTableTimer();if(!d.tabla_auto)return;const total=Math.ceil((d.detalles||[]).length/(d.filas_por_pagina||8));if(total<=1)return;const ms=((d.config||{}).tabla_rotacion_seg||8)*1000;tableTimer=setInterval(()=>{if(!lastPayload||TYPE!=='sorteo')return;tablePage=(tablePage%total)+1;document.getElementById('stage').innerHTML=renderTable(lastPayload,tablePage);},ms);}
function render(d){lastPayload=d;applyConfig(d);const stage=document.getElementById('stage');if(!d.visible){stopTableTimer();stage.classList.add('hidden');stage.innerHTML='';return;}stage.classList.remove('hidden');if(TYPE==='graph'){stopTableTimer();stage.innerHTML=lower(d);}else if(TYPE==='sorteo'){tablePage=d.tabla_pagina||1;stage.innerHTML=renderTable(d,tablePage);scheduleTable(d);}else if(TYPE==='ticker'){stopTableTimer();stage.innerHTML=ticker(d);}else if(TYPE==='campeonato'){stopTableTimer();stage.innerHTML=positions(d);}else{stopTableTimer();stage.classList.add('hidden');}}
async function poll(){try{const q=PREVIEW?'?preview=1':'';const r=await fetch(`/tv/salida/${encodeURIComponent(TOKEN)}/${encodeURIComponent(TYPE)}/estado${q}`,{cache:'no-store'});if(r.status===404){document.getElementById('stage').classList.add('hidden');return;}if(!r.ok)return;const d=await r.json();if(d.actualizado_en!==lastStamp){lastStamp=d.actualizado_en;render(d);}}catch(e){}finally{setTimeout(poll,500);}}
poll();
</script>
</body>
</html>
