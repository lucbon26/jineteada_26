{% extends "base.html" %}
{% block contenido %}
<div class="container-fluid">
    <div class="mb-4">
        <h1 class="h3 mb-1">{% if jinete %}Editar jinete{% else %}Nuevo jinete{% endif %}</h1>
        <p class="text-muted mb-0">Datos personales y de contacto del jinete.</p>
    </div>

    <form method="post" action="{% if jinete %}/jinetes/{{ jinete.id }}/editar{% else %}/jinetes/nuevo{% endif %}">
        <div class="card shadow-sm mb-4">
            <div class="card-header"><strong>Datos personales</strong></div>
            <div class="card-body"><div class="row g-3">
                <div class="col-md-6"><label class="form-label">Nombres *</label>
                    <input type="text" class="form-control" name="nombres" value="{{ jinete.nombres if jinete else '' }}" required maxlength="100"></div>
                <div class="col-md-6"><label class="form-label">Apellidos *</label>
                    <input type="text" class="form-control" name="apellidos" value="{{ jinete.apellidos if jinete else '' }}" required maxlength="100"></div>
                <div class="col-md-4"><label class="form-label">DNI *</label>
                    <input type="text" class="form-control" name="dni" value="{{ jinete.dni if jinete else '' }}" required maxlength="20"></div>
                <div class="col-md-4"><label class="form-label">Fecha de nacimiento</label>
                    <input type="date" class="form-control" name="fecha_nacimiento" value="{{ jinete.fecha_nacimiento.isoformat() if jinete and jinete.fecha_nacimiento else '' }}"></div>
                <div class="col-md-4"><label class="form-label">Sexo</label>
                    <select class="form-select" name="sexo">
                        <option value="">Seleccionar</option>
                        <option value="Masculino" {% if jinete and jinete.sexo=="Masculino" %}selected{% endif %}>Masculino</option>
                        <option value="Femenino" {% if jinete and jinete.sexo=="Femenino" %}selected{% endif %}>Femenino</option>
                        <option value="Otro" {% if jinete and jinete.sexo=="Otro" %}selected{% endif %}>Otro</option>
                    </select></div>
                <div class="col-md-6"><label class="form-label">Nacionalidad</label>
                    <input type="text" class="form-control" name="nacionalidad" value="{{ jinete.nacionalidad if jinete and jinete.nacionalidad else '' }}" maxlength="60"></div>
                <div class="col-md-6"><label class="form-label">Club o agrupación</label>
                    <input type="text" class="form-control" name="club_agrupacion" value="{{ jinete.club_agrupacion if jinete and jinete.club_agrupacion else '' }}" maxlength="150"></div>
            </div></div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header"><strong>Contacto y ubicación</strong></div>
            <div class="card-body"><div class="row g-3">
                <div class="col-md-6"><label class="form-label">Celular</label>
                    <input type="text" class="form-control" name="celular" value="{{ jinete.celular if jinete and jinete.celular else '' }}" maxlength="30"></div>
                <div class="col-md-6"><label class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" name="email" value="{{ jinete.email if jinete and jinete.email else '' }}" maxlength="150"></div>
                <div class="col-md-6"><label class="form-label">Provincia</label>
                    <input type="text" class="form-control" name="provincia" value="{{ jinete.provincia if jinete and jinete.provincia else '' }}" maxlength="100"></div>
                <div class="col-md-6"><label class="form-label">Localidad</label>
                    <input type="text" class="form-control" name="localidad" value="{{ jinete.localidad if jinete and jinete.localidad else '' }}" maxlength="100"></div>
            </div></div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header"><strong>Información adicional</strong></div>
            <div class="card-body"><div class="row g-3">
                <div class="col-md-6"><label class="form-label">Categoría habitual</label>
                    <input type="text" class="form-control" name="categoria_habitual" value="{{ jinete.categoria_habitual if jinete and jinete.categoria_habitual else '' }}" maxlength="100"></div>
                <div class="col-12"><label class="form-label">Observaciones</label>
                    <textarea class="form-control" name="observaciones" rows="4">{{ jinete.observaciones if jinete and jinete.observaciones else '' }}</textarea></div>
                <div class="col-md-6"><label class="form-label">Estado</label>
                    <select class="form-select" name="estado">
                        <option value="activo" {% if not jinete or jinete.estado=="activo" %}selected{% endif %}>Activo</option>
                        <option value="inactivo" {% if jinete and jinete.estado=="inactivo" %}selected{% endif %}>Inactivo</option>
                        <option value="suspendido" {% if jinete and jinete.estado=="suspendido" %}selected{% endif %}>Suspendido</option>
                        <option value="descalificado" {% if jinete and jinete.estado=="descalificado" %}selected{% endif %}>Descalificado</option>
                    </select></div>
            </div></div>
        </div>

        <div class="d-flex justify-content-between align-items-center gap-2">
            <div>
                {% if jinete %}
                <button type="submit" class="btn btn-outline-danger"
                    formaction="/jinetes/{{ jinete.id }}/eliminar" formmethod="post" formnovalidate
                    onclick="return confirm('¿Eliminar definitivamente este jinete? Se borrarán también sus categorías por campeonato y participaciones por fecha. Esta acción no se puede deshacer.');">
                    Eliminar jinete
                </button>
                {% endif %}
            </div>
            <div class="d-flex gap-2">
                <a href="/jinetes" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Guardar jinete</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
